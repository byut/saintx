<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Saint X</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <header class="topbar">
    <button id="menu-toggle" class="icon-btn silhouette-icon icon-menu" aria-label="Menu"></button>
    <div class="tabs">
      <button class="tab" data-tab="home">Início</button>
      <button class="tab" data-tab="catalog">Catálogo</button>
      <button class="tab" data-tab="cart">Carrinho</button>
    </div>
    <button id="account-toggle" class="icon-btn silhouette-icon icon-account" aria-label="Conta"></button>
  </header>

  <aside id="side-menu" class="side-menu hidden">
    <nav>
      <button class="side-menu-item" data-panel="settings">Configurações</button>
      <button class="side-menu-item" data-panel="account">Conta</button>
      <button class="side-menu-item" data-panel="support">Suporte</button>
    </nav>
  </aside>

  <section id="panel-settings" class="panel hidden">
    <h2>Configurações</h2>
    <label class="switch-row">
      <span>Som de clique</span>
      <input type="checkbox" id="sound-toggle" checked />
    </label>
  </section>

  <section id="panel-support" class="panel hidden">
    <h2>Suporte</h2>
    <p>Fale com nosso assistente de IA ou envie uma mensagem para a equipe.</p>
    <textarea id="support-message" placeholder="Digite sua dúvida..."></textarea>
    <button id="support-send">Enviar</button>
  </section>

  <main>
    <div id="viewer-container"></div>
    <div id="color-picker" class="color-picker hidden"></div>
  </main>

  <footer class="bottom-account-bar">
    <button class="icon-btn silhouette-icon icon-account" aria-label="Conta"></button>
  </footer>

  <script type="module" src="js/viewer3d.js"></script>
  <script src="js/sidebar.js"></script>
  <script src="js/sound.js"></script>
</body>
</html>
